<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c2433" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#58a6ff" />
      <stop offset="100%" stop-color="#1f6feb" />
    </linearGradient>
    <linearGradient id="tagGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a371f7" />
      <stop offset="100%" stop-color="#8957e5" />
    </linearGradient>
  </defs>

  <!-- 앱 배경 스쿼클 -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bgGrad)" stroke="#30363d" stroke-width="3" />

  <!-- 바이닐 레코드판 (음악) -->
  <circle cx="54" cy="56" r="36" fill="#0f1117" stroke="#58a6ff" stroke-width="3" />
  <circle cx="54" cy="56" r="26" fill="none" stroke="#1f6feb" stroke-width="1.8" stroke-opacity="0.6" />
  <circle cx="54" cy="56" r="18" fill="none" stroke="#58a6ff" stroke-width="1.4" stroke-opacity="0.4" />
  <circle cx="54" cy="56" r="11" fill="url(#accentGrad)" />
  <circle cx="54" cy="56" r="3.5" fill="#0d1117" />

  <!-- 메타데이터 태그 라벨 -->
  <g transform="translate(84, 84) rotate(-45)">
    <path
      d="M -10 -24 L 10 -24 L 19 -14 L 19 18 Q 19 24 13 24 L -13 24 Q -19 24 -19 18 L -19 -14 Z"
      fill="url(#tagGrad)"
      stroke="#e6edf3"
      stroke-width="2.2"
    />
    <!-- 태그 구멍 -->
    <circle cx="0" cy="-14" r="3.5" fill="#0d1117" />
    <!-- 태그 메타데이터 라인 -->
    <rect x="-10" y="-2" width="20" height="4.2" rx="2.1" fill="#ffffff" />
    <rect x="-10" y="6.5" width="13" height="4.2" rx="2.1" fill="#ffffff" fill-opacity="0.88" />
  </g>
</svg>